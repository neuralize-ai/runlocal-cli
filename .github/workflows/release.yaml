name: Release

# Publishes @runlocal-ai/cli to npm when a version tag, such as v0.3.0, is pushed.
# It uses npm trusted publishing (GitHub OIDC): no npm token is stored. On
# npmjs.com, the package's trusted publisher is this repository and this
# workflow file. The package publishes with provenance, which ties it to the
# commit it was built from.
#
# Set the version in package.json to the version of the tag before tagging.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No registry-url: it sets a placeholder NODE_AUTH_TOKEN, which npm would send in place of trusted publishing.
      - name: The tag names the version of package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "The tag ${GITHUB_REF_NAME} is not v${version}."; exit 1; }
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm test
        env:
          RLX_DENY_HASHES: ${{ secrets.RLX_DENY_HASHES }}
      - run: npm publish --provenance --access public
